name: Verifier le vrai Setup publie sans nouvelle release
on:
  push:
    branches: ['diagnostic/windows-install-*']
    paths-ignore: ['verification/installation-01420-e2e.*']
permissions:
  contents: write
concurrency:
  group: install-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Accuser le demarrage
        shell: powershell
        run: |
          $report='verification/installation-01420-e2e.json'
          $data=[ordered]@{version='0.14.20';status='running';sourceCommit=$env:GITHUB_SHA;startedUtc=[DateTime]::UtcNow.ToString('o');workflowUrl="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID";published=$false}
          [IO.File]::WriteAllText((Join-Path $pwd $report),($data|ConvertTo-Json),[Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $report
          git commit -m 'Demarrer le test du vrai Setup public 0.14.20'
          if($LASTEXITCODE -ne 0){throw 'Accuse non enregistre.'}
          git push origin ("HEAD:"+$env:GITHUB_REF_NAME)
          if($LASTEXITCODE -ne 0){throw 'Accuse non synchronise.'}
      - name: Executer le vrai Setup 0.14.20 et sa chaine complete
        shell: powershell
        run: .github/scripts/verifier-installation-reelle.ps1 -Version 0.14.20 -ExpectedSetupSha 295fae401937f707642c1e8ef4c03fa2ea53c7d5a6a55be8eb4780e799d817c5
      - name: Renvoyer le diagnostic par Git
        if: always()
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- verification/installation-01420-e2e.json
          if(Test-Path verification/installation-01420-e2e.png){git add -- verification/installation-01420-e2e.png}
          git diff --cached --quiet
          if($LASTEXITCODE -eq 1){
            git commit -m 'Consigner le test du vrai installateur public 0.14.20'
            if($LASTEXITCODE -ne 0){throw 'Diagnostic non enregistre.'}
            git push origin ("HEAD:"+$env:GITHUB_REF_NAME)
            if($LASTEXITCODE -ne 0){throw 'Diagnostic non synchronise.'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-installation-publiee-01420
          retention-days: 14
          path: verification/installation-01420-e2e.*
