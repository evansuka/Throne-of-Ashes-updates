name: Verifier le vrai Setup publie sans nouvelle release
on:
  push:
    branches: ['diagnostic/windows-install-*']
    paths-ignore: ['verification/installation-01419-e2e.*']
permissions:
  contents: write
concurrency:
  group: install-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Accuser le demarrage
        shell: powershell
        run: |
          $report='verification/installation-01419-e2e.json'
          $data=[ordered]@{version='0.14.19';status='running';sourceCommit=$env:GITHUB_SHA;startedUtc=[DateTime]::UtcNow.ToString('o');workflowUrl="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID";published=$false}
          [IO.File]::WriteAllText((Join-Path $pwd $report),($data|ConvertTo-Json),[Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $report
          git commit -m 'Demarrer le test du vrai Setup public 0.14.19'
          if($LASTEXITCODE -ne 0){throw 'Accuse non enregistre.'}
          git push origin ("HEAD:"+$env:GITHUB_REF_NAME)
          if($LASTEXITCODE -ne 0){throw 'Accuse non synchronise.'}
      - name: Executer le vrai Setup 0.14.19 et sa chaine complete
        shell: powershell
        run: .github/scripts/verifier-installation-reelle.ps1 -Version 0.14.19 -ExpectedSetupSha 346821545ce6f4a56aa4f8b8ef552a54f1284b1b952949c5ce72cba171a21a13
      - name: Renvoyer le diagnostic par Git
        if: always()
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- verification/installation-01419-e2e.json
          if(Test-Path verification/installation-01419-e2e.png){git add -- verification/installation-01419-e2e.png}
          git diff --cached --quiet
          if($LASTEXITCODE -eq 1){
            git commit -m 'Consigner le test du vrai installateur public 0.14.19'
            if($LASTEXITCODE -ne 0){throw 'Diagnostic non enregistre.'}
            git push origin ("HEAD:"+$env:GITHUB_REF_NAME)
            if($LASTEXITCODE -ne 0){throw 'Diagnostic non synchronise.'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-installation-publiee-01419
          retention-days: 14
          path: verification/installation-01419-e2e.*
