name: Verifier et publier Windows

on:
  push:
    branches:
      - 'publication/**'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publier:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Identifier la version
        shell: powershell
        run: |
          $tag=$env:RELEASE_TAG -replace '^publication/',''
          if($tag -notmatch '^v\d+\.\d+\.\d+$'){throw 'Version invalide.'}
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recuperer uniquement les paquets de distribution
        uses: actions/checkout@v4
        with:
          ref: livraison/${{ env.RELEASE_TAG }}
          path: .publication
          persist-credentials: false
      - name: Verifier les paquets et le lanceur sur Windows
        shell: powershell
        run: |
          try{.github/scripts/verifier-paquet.ps1 -Directory .publication -Tag $env:RELEASE_TAG}
          catch{Write-Output "::error::$($_.Exception.Message)";throw}
      - name: Verifier l installation locale et les mises a jour du lanceur
        shell: powershell
        run: .github/scripts/verifier-installation.ps1 -Setup "$pwd/.publication/Throne-of-Ashes-Setup.exe"
      - name: Verifier la vraie fenetre du jeu avant publication
        shell: powershell
        run: .github/scripts/verifier-fenetre-jeu.ps1 -Directory .publication -Tag $env:RELEASE_TAG
      - name: Creer la release et verifier les fichiers transferes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $version=$env:RELEASE_TAG.Substring(1)
          $short=($version -split '\.')[0..1] -join '.'
          $names=@("Throne-of-Ashes-$version-update.zip", "Throne-of-Ashes-Godot-$short-Windows.zip", 'Throne-of-Ashes.exe', 'Throne-of-Ashes-Setup.exe', 'update.json')
          $assets=@($names | ForEach-Object { Join-Path .publication $_ })
          & gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --draft --title "Throne of Ashes $version" --notes-file .publication/RELEASE.md
          if($LASTEXITCODE -ne 0){throw 'Creation de la release refusee; aucune activation.'}
          $download=Join-Path $env:RUNNER_TEMP ('relecture-'+[Guid]::NewGuid().ToString('N'))
          & gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $download
          if($LASTEXITCODE -ne 0){throw 'Relecture des assets impossible; release conservee en brouillon.'}
          foreach($name in $names){
            $expected=(Get-FileHash -LiteralPath (Join-Path .publication $name) -Algorithm SHA256).Hash
            $actual=(Get-FileHash -LiteralPath (Join-Path $download $name) -Algorithm SHA256).Hash
            if($expected -ne $actual){throw "Empreinte distante incorrecte : $name"}
          }
          & gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if($LASTEXITCODE -ne 0){throw 'Activation de la release interrompue.'}
          "RELEASE_ACTIVATED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "PUBLISHED_RELEASE: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
          $cleanupOk=$false
          try{
            & gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/livraison/$env:RELEASE_TAG"
            $cleanupOk=$LASTEXITCODE -eq 0
          }catch{Write-Warning ('Nettoyage indisponible : '+$_.Exception.Message)}
          "RELEASE_CLEANUP_OK=$cleanupOk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if(-not $cleanupOk){Write-Warning 'Release publiee; branche temporaire a nettoyer.'}
          # Activation and cleanup have independent outcomes.
          $global:LASTEXITCODE=0
      - name: Consigner le resultat de publication
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $version=$env:GITHUB_REF_NAME -replace '^publication/','' -replace '^v',''
          if($version -notmatch '^\d+\.\d+\.\d+$'){exit 0}
          $ok='${{ job.status }}' -eq 'success'
          $published=$env:RELEASE_ACTIVATED -eq 'true'
          $report=[ordered]@{version=$version;status=$(if($ok){'passed'}else{'failed'});published=$published;cleanupSucceeded=($env:RELEASE_CLEANUP_OK -eq 'True');sourceCommit=$env:GITHUB_SHA;completedUtc=[DateTime]::UtcNow.ToString('o');workflowUrl="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID";releaseUrl="https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"}
          if(Test-Path verification/game-window.json){$report['windowCheck']=Get-Content verification/game-window.json -Raw | ConvertFrom-Json}
          if(Test-Path verification/launcher-recovery.json){$report['recoveryCheck']=Get-Content verification/launcher-recovery.json -Raw | ConvertFrom-Json}
          if(Test-Path verification/dungeon-render.json){$report['dungeonRenderCheck']=Get-Content verification/dungeon-render.json -Raw | ConvertFrom-Json}
          $json=$report|ConvertTo-Json -Depth 12
          $path="verification/publication-$version.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config credential.helper '!gh auth git-credential'
          git fetch origin main
          if($LASTEXITCODE -ne 0){throw 'Lecture du suivi distant impossible.'}
          git switch --detach FETCH_HEAD
          if($LASTEXITCODE -ne 0){throw 'Preparation du suivi impossible.'}
          [IO.File]::WriteAllText((Join-Path $pwd $path),$json,[Text.UTF8Encoding]::new($false))
          git add -- $path
          git commit -m "Consigner la publication Windows $version"
          if($LASTEXITCODE -ne 0){throw 'Rapport non enregistre.'}
          for($attempt=0;$attempt -lt 3;$attempt++){
            git push origin HEAD:main
            if($LASTEXITCODE -eq 0){break}
            git fetch origin main
            git rebase FETCH_HEAD
            if($LASTEXITCODE -ne 0){throw 'Conflit du suivi distant.'}
          }
          if($LASTEXITCODE -ne 0){throw 'Rapport de publication non synchronise.'}
